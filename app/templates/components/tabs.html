{% macro tabs(prefix, label, items, modifier="") -%}
<div class="tabs{% if modifier %} tabs--{{ modifier }}{% endif %}" data-tabs>
  <div class="tabs__list" role="tablist" aria-label="{{ label }}">
    {% for key, title in items %}
    <button type="button" class="tabs__tab" role="tab" id="{{ prefix }}-tab-{{ key }}" aria-controls="{{ prefix }}-{{ key }}" aria-selected="{{ 'true' if loop.first else 'false' }}" data-tab="{{ key }}">{{ title }}</button>
    {% endfor %}
  </div>
{{ caller() }}
</div>
{%- endmacro %}

{% macro tab_panel(prefix, key, heading, modifier="") -%}
<section class="tabs__panel{% if modifier %} tabs__panel--{{ modifier }}{% endif %}" id="{{ prefix }}-{{ key }}" role="tabpanel" aria-labelledby="{{ prefix }}-tab-{{ key }}" tabindex="0">
  <h2 class="tabs__heading">{{ heading }}</h2>
{{ caller() }}
</section>
{%- endmacro %}
