<select name="main_article_id">
  <option value="">Aucun</option>
  {% for article in articles %}
  <option value="{{ article.wa_id }}" {% if article.wa_id == selected_main %}selected{% endif %}>{{ article.title }} · {{ article.template_type | template_label }}{% if not article.player_visible %} (invisible pour le joueur){% endif %}</option>
  {% endfor %}
</select>
